<!DOCTYPE html>
<html>

<head>
    <title>Birthday Surprise 💙</title>

    <style>

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;

            background: linear-gradient(
                #061633,
                #0b2b5c,
                #123f7a
            );

            font-family: Arial, sans-serif;
            color: white;
        }


        /* =========================
           BIRTHDAY TEXT
        ========================= */

        .birthday-text {
            position: absolute;
            top: 8%;
            width: 100%;
            text-align: center;

            opacity: 0;

            animation: fadeIn 2s ease forwards;
            animation-delay: 3s;

            z-index: 10;
        }

        .birthday-text h1 {
            font-family: Georgia, serif;
            font-size: 45px;

            color: #9dd2ff;

            margin-bottom: 10px;
        }

        .birthday-text p {
            font-size: 18px;
            color: #dceeff;
        }


     .bouquet {
    position: absolute;
    
    width: 500px;
    height: 500px;
    
    left: 50%;
    bottom: 2%;
    
    transform: translateX(-50%);
    
    z-index: 1;
    
    animation: bouquetRise 1.5s ease-out forwards;
}

@keyframes bouquetRise {
    from {
        opacity: 0;
        transform: translate(-50%, 100px);
    }
    
    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}


    /* =========================
   LILY OF THE VALLEY
========================= */

.lily-stem {
    position: absolute;
    width: 5px;
    height: 220px;
    background: linear-gradient(
        to right,
        #285c3d,
        #5f9b68,
        #285c3d
    );
    bottom: 70px;
    left: 50%;
    border-radius: 10px;
    transform-origin: bottom center;
}

/* Individual stems */

.lily-stem.stem1 {
    transform: rotate(-22deg);
}

.lily-stem.stem2 {
    transform: rotate(-8deg);
}

.lily-stem.stem3 {
    transform: rotate(8deg);
}

.lily-stem.stem4 {
    transform: rotate(22deg);
}


/* =========================
   LILY BELLS
========================= */

.bell {
    position: absolute;

    width: 24px;
    height: 20px;

    background: linear-gradient(
        135deg,
        #ffffff,
        #f1f4f7
    );

    border-radius: 5px 5px 12px 12px;

    box-shadow:
        0 3px 6px rgba(0, 0, 0, 0.18);

    transform: rotate(90deg);
}

/* Small opening underneath each bell */

.bell::after {
    content: "";

    position: absolute;

    width: 8px;
    height: 5px;

    background: #dfe5e9;

    border-radius: 50%;

    bottom: -2px;
    left: 8px;
}


/* Bell positions */

.bell1 {
    top: 35px;
    left: -5px;
}

.bell2 {
    top: 65px;
    left: 2px;
}

.bell3 {
    top: 95px;
    left: -6px;
}

.bell4 {
    top: 125px;
    left: 3px;
}

.bell5 {
    top: 155px;
    left: -5px;
}


/* =========================
   LILY LEAVES
========================= */

.lily-leaf {
    position: absolute;

    width: 45px;
    height: 130px;

    background: linear-gradient(
        90deg,
        #234f35,
        #5f9b68,
        #234f35
    );

    border-radius: 100% 0 100% 0;

    bottom: 55px;
}

.leaf1 {
    left: 165px;
    bottom: 55px;
    transform: rotate(-25deg);
}

.leaf2 {
    left: 215px;
    bottom: 55px;
    transform: rotate(5deg);
}

.leaf3 {
    left: 265px;
    bottom: 55px;
    transform: rotate(25deg);
}


        /* =========================
           WRAPPING PAPER
        ========================= */

        .wrapper {
            position: absolute;

            width: 330px;
            height: 220px;

            bottom: 20px;
            left: 85px;

            background: rgba(180, 220, 255, 0.25);

            clip-path: polygon(
                5% 0%,
                95% 0%,
                70% 100%,
                30% 100%
            );

            opacity: 1;

        }


        /* =========================
           RIBBON
        ========================= */

        .ribbon {
    position: absolute;
    
    width: 70px;
    height: 35px;
    
    bottom: 45px;
    left: 215px;
    
    background: #6bbcff;
    
    border-radius: 50%;
    
    opacity: 1;
}

        .ribbon::before,
        .ribbon::after {

            content: "";

            position: absolute;

            width: 60px;
            height: 80px;

            background: #6bbcff;

            top: 20px;
        }

        .ribbon::before {
            right: 45px;

            transform: rotate(25deg);
        }

        .ribbon::after {
            left: 45px;

            transform: rotate(-25deg);
        }


        /* =========================
           FLOATING PETALS
        ========================= */

        .floating-petal {

            position: absolute;

            width: 18px;
            height: 30px;

            background: #79bdff;

            border-radius: 50%;

            opacity: 0;

            animation: floatPetal 7s infinite ease-in-out;
        }

        .fp1 {
            left: 15%;
            top: 70%;

            animation-delay: 1s;
        }

        .fp2 {
            left: 80%;
            top: 75%;

            animation-delay: 3s;
        }

        .fp3 {
            left: 25%;
            top: 50%;

            animation-delay: 5s;
        }

        .fp4 {
            left: 70%;
            top: 45%;

            animation-delay: 2s;
        }


        /* =========================
           BUTTON
        ========================= */

        .surprise-button {

            position: absolute;

            bottom: 4%;
            left: 50%;

            transform: translateX(-50%);

            padding: 15px 28px;

            border: none;

            border-radius: 30px;

            background: #4da6ff;

            color: white;

            font-size: 17px;

            cursor: pointer;

            opacity: 0;

            animation: fadeIn 2s ease forwards;
            animation-delay: 6s;

            z-index: 20;
        }

        .surprise-button:hover {

            transform:
                translateX(-50%)
                scale(1.08);
        }


        /* =========================
           HIDDEN MESSAGE
        ========================= */

        .message {

            position: fixed;

            inset: 0;

            background:
                rgba(5, 20, 50, 0.96);

            display: flex;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px;

            opacity: 0;

            pointer-events: none;

            transition: 0.5s;

            z-index: 50;
        }

        .message.show {

            opacity: 1;

            pointer-events: auto;
        }

        .message-box {

            max-width: 500px;
        }

        .message-box h2 {

            font-family: Georgia, serif;

            font-size: 35px;

            color: #9dd2ff;
        }

        .message-box p {

            line-height: 1.7;

            color: #dceeff;

            font-size: 18px;
        }

        .close-button {

            padding: 10px 20px;

            border: none;

            border-radius: 20px;

            background: #4da6ff;

            color: white;

            cursor: pointer;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes bloom {

            0% {

                opacity: 0;

                transform:
                    scale(0)
                    rotate(-20deg);
            }

            70% {

                transform:
                    scale(1.15)
                    rotate(5deg);
            }

            100% {

                opacity: 1;

                transform:
                    scale(1)
                    rotate(0deg);
            }
        }


        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes floatPetal {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            20% {

                opacity: 1;
            }

            100% {

                transform:
                    translateY(-350px)
                    rotate(180deg);

                opacity: 0;
            }
        }

        @keyframes growStem {
            0% {
               transform: scaleY(0); rotate(var(--angle));
            }

           40% {
               transform: scaleY(1); rotate(var(--angle));
           }

           55% {
               transform: scaleY(1.02) rotate(calc(var(--angle) + 2deg)); 
           }

           70% {
               transform: scaleY(1.02) rotate(calc(var(--angle) - 2deg));
           }

           85% {
               transform: scaleY(1.02) rotate(calc(var(--angle) + 1deg));
           }

           100% {
                transform: scaleY(1) rotate(var(--angle));
           }
}


/* =========================
   GLOSSY 3D RED HEARTS
========================= */

.heart {
    position: absolute;
    width: 55px;
    height: 55px;

    left: 78%;
    top: 55%;

    z-index: 15;
    pointer-events: none;
}

.heart1 {
    animation: heartTrail 3.5s linear infinite;
animation-delay: 0s;
}

.heart2 {
    animation: heartTrail 3.5s linear infinite;
    animation-delay: 1.2s;
}

.heart3 {
    animation: heartTrail 3.5s linear infinite;
    animation-delay: 2.4s;
}


@keyframes heartTrail {
    0% {
        transform: translate(0, 0) rotate(-45deg) scale(1);
        opacity: 1;
    }

    70% {
        transform: translate(112px, -112px) rotate(-45deg) scale(1);
        opacity: 1;
    }

    100% {
        transform: translate(160px, -160px) rotate(-45deg) scale(1);
        opacity: 0;
    }
}

/* =========================
   LETTER ENVELOPE
========================= */

/* =========================
   LETTER ENVELOPE
========================= */

.envelope-container {
    position: fixed;

    left: 15%;
    top: 55%;

    transform: translate(-50%, -50%);


transition:
    left 0.9s ease,
    transform 0.9s ease;

    z-index: 1000;

    opacity: 0;

    animation: envelopeAppear 2s ease forwards;
    animation-delay: 7s;
}



.tap-instruction {
    width: 100%;
    margin-bottom: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    position: relative;
    z-index: 10;
    opacity: 1;
    transition: opacity 0.6s ease;
    animation: gentlePulse 1.8s ease-in-out infinite;
}

.tap-instruction.hide {
    animation: none;
    opacity: 0;
    pointer-events: none;
}

@keyframes gentlePulse {
    0%, 100% {
        opacity: 0.65;
        transform: translateY(0);
    }

    50% {
        opacity: 1;
        transform: translateY(-3px);
    }
}

.envelope-container.move-to-center {
    left: 50%;
}

.envelope {
    position: relative;

    perspective: 800px;

    width: 320px;
    height: 210px;

    background: #dceeff;

    border-radius: 8px;

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.35);

    cursor: pointer;

overflow: visible;

transform-origin: center center;

transition:
    transform 0.8s ease,
    box-shadow 0.8s ease;
}

.envelope-side-left {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    border-top: 105px solid transparent;
    border-bottom: 105px solid transparent;
    border-left: 160px solid #c8e5ff;
    z-index: 7;
}

.envelope-side-right {
    position: absolute;
    right: 0;
    top: 0;
    width: 0;
    height: 0;
    border-top: 105px solid transparent;
    border-bottom: 105px solid transparent;
    border-right: 160px solid #c8e5ff;
    z-index: 7;
}

/* =========================
   LETTER
========================= */

.letter {
    position: absolute;

    width: 85%;
    height: 180px;

    background: white;
    color: #333;

    left: 7.5%;
    bottom: 20px;

    padding: 20px;

    box-sizing: border-box;

    border-radius: 5px;

    z-index: 5;

opacity: 0;
visibility: hidden;

    transform: translateY(100px);

    transition:
        transform 0.8s ease-out;
}

.envelope.letter-out .letter {
    transform: translateY(-120px);
    opacity: 1;
    visibility: visible;
    z-index: 11;
}

.letter h2 {
    font-family: Georgia, serif;

    color: #246bb2;

    margin-top: 5px;

    font-size: 22px;
}


.letter p {
    font-size: 15px;

    line-height: 1.5;
}


.signature {
    margin-top: 15px;

    font-family: Georgia, serif;

    font-style: italic;
}


/* =========================
   LEFT SIDE FOLD
========================= */

.envelope-side-left {
    position: absolute;

    left: 0;
    top: 0;

    width: 0;
    height: 0;

    border-top: 105px solid transparent;
    border-bottom: 105px solid transparent;
    border-left: 160px solid #c8e5ff;

    z-index: 7;
}


/* =========================
   RIGHT SIDE FOLD
========================= */

.envelope-side-right {
    position: absolute;

    right: 0;
    top: 0;

    width: 0;
    height: 0;

    border-top: 105px solid transparent;
    border-bottom: 105px solid transparent;
    border-right: 160px solid #c8e5ff;

    z-index: 7;
}


/* =========================
   FRONT / BOTTOM FOLD
========================= */

.envelope::before {
    content: "";

    position: absolute;

    left: 0;
    bottom: 0;

    width: 0;
    height: 0;

    border-left: 160px solid transparent;
    border-right: 160px solid transparent;
    border-bottom: 120px solid #b8dcff;

    z-index: 8;

    pointer-events: none;
}


/* =========================
   TOP FLAP
========================= */

.envelope-flap {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 105px;

    background: #b9ddff;

    clip-path: polygon(
        0 0,
        100% 0,
        50% 100%
    );

    z-index: 10;

    transform-origin: top center;

    transition:
        transform 1.1s ease;
}


/* =========================
   OPEN ANIMATION
========================= */

.envelope.open {
    transform: scale(1.35);
    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.45);
}

.envelope.open .envelope-flap {
    transform: rotateX(180deg);
}

.envelope.open .letter {
    transform: translateY(0);
    z-index: 11;
}

.envelope.letter-out .letter {
    transform: translateY(-220px);
}

/* =========================
   ENVELOPE ENTRANCE
========================= */

@keyframes envelopeAppear {

    from {
        opacity: 0;

        transform:
            translate(-50%, -40%);
    }

    to {
        opacity: 1;

        transform:
            translate(-50%, -50%);
    }
}

</style>

</head>

          <!-- JAVASCRIPT -->

<script>

   function openLetter() {
    const envelope = document.querySelector(".envelope");
    const container = document.querySelector(".envelope-container");
    const instruction = document.querySelector(".tap-instruction");

    if (instruction) {
        instruction.classList.add("hide");
    }

    // Move envelope to center
    container.classList.add("move-to-center");

    // Wait for the envelope to reach the center
    setTimeout(() => {

        // Open the flap first
        envelope.classList.add("open");

        // Let the flap open before the letter comes out
        setTimeout(() => {
            envelope.classList.add("letter-out");
        }, 300);

    }, 900);
}

</script>
